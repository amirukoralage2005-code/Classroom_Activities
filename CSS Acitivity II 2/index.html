<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Box Model</title>
  <style>
    body{
      margin: 10px;
    }
    div{
      height: 200px;
      width: 200px;
      margin: 0px;
      position: absolute;
    }
    .box1{
      background-color: cadetblue;
      padding: 20px;
      border: 10px solid black;
      left: 0;
      top: 0;
    }
    p{
      margin: 0px;
    }
    .box2{
      background-color: gold;
      border-top: 20px solid black;
      border-bottom: 20px solid black;
      border-left: 10px solid black;
      border-right: 10px solid black;
      left: 260px;
      top: 260px;
    }
    .box3{
      background-color: indianred;
      border: 10px solid black;
      left: 40px;
      top: 500px;
    }
  </style>
</head>

<body>
  <div class="box1">
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      Aliquam at sapien porttitor urna elementum lacinia. In id
      magna pulvinar, ultricies lorem id, vehicula elit. Aliquam
      eu luctus nisl, vitae pellentesque magna. Phasellus dolor
      metus, laoreet ac convallis sit amet, efficitur sed dolor.
    </p>
  </div>
  <div class="box2">
  </div>
  <div class="box3">
  </div>
</body>

</html>
